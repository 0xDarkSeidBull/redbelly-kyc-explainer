# Serves the guide from a VPS. Copy to /etc/nginx/sites-available/kyc-explainer,
# replace kyc.example.com with your domain, then enable it (see deploy/README.md).
server {
    listen 80;
    listen [::]:80;
    server_name kyc.example.com;

    root /var/www/redbelly-kyc-explainer/docs;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Keep the evidence, scripts and git history off the public site.
    location ~ /\. { deny all; }
}
